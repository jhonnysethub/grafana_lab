
services:
  # Aplicação Python Flask
  carnivorous-garden:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: carnivorous-garden

    ports:
      - "5005:5005"

    volumes:
      - ./logs:/app/logs

    networks:
      - loki

    restart: unless-stopped


  # Serviço de coleta de logs
  alloy:
    image: grafana/alloy:latest

    container_name: alloy

    ports:
      - "12345:12345"

    volumes:
      - ./config.alloy:/etc/alloy/alloy-config.alloy:ro
      - ./logs:/tmp/app-logs:ro

    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

    depends_on:
      - carnivorous-garden
      - loki

    networks:
      - loki

    restart: unless-stopped


  # Serviço de armazenamento de logs
  loki:
    image: grafana/loki:latest

    container_name: loki

    volumes:
      - ./loki-data:/loki

    command: -config.file=/etc/loki/local-config.yaml

    networks:
      - loki

    restart: unless-stopped


  # Serviço de visualização dos logs
  grafana:
    image: grafana/grafana:latest

    container_name: grafana

    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false

    ports:
      - "3000:3000"

    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/grafana/provisioning/datasources

        cat <<EOF > /etc/grafana/provisioning/datasources/loki.yaml
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            access: proxy
            url: http://loki:3100
            isDefault: true
            editable: true
        EOF

        exec /run.sh

    depends_on:
      - loki

    networks:
      - loki

    restart: unless-stopped


networks:
  loki:
    driver: bridge
